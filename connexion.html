<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPE VOICE - Connexion</title>
    <style>
        :root {
            --primary-gold: #FFD700;
            --dark-gold: #FFA500;
            --deep-red: #D32F2F;
            --dark-red: #B71C1C;
            --accent-blue: #0D47A1;
        }
        body {
            background: linear-gradient(135deg, var(--primary-gold) 0%, var(--dark-gold) 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background: #FFFFFF;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 480px;
            border: 4px solid var(--primary-gold);
            box-sizing: border-box;
        }
        h2 { 
            text-align: center; 
            color: var(--accent-blue); 
            text-transform: uppercase; 
            margin-bottom: 25px; 
            font-size: 1.5rem; 
        }
        label { 
            display: block; 
            margin-top: 12px; 
            font-weight: bold; 
            color: var(--accent-blue); 
            font-size: 13px; 
        }
        input { 
            width: 100%; 
            padding: 11px; 
            margin-top: 5px; 
            border: 2px solid #E0E0E0; 
            border-radius: 8px; 
            font-size: 14px; 
            box-sizing: border-box; 
        }
        input:focus { 
            outline: none; 
            border-color: var(--deep-red); 
        }
        .password-container { 
            position: relative; 
        }
        .password-container input { 
            padding-right: 40px; 
        }
        .toggle-password { 
            position: absolute; 
            right: 12px; 
            top: 55%; 
            transform: translateY(-50%); 
            cursor: pointer; 
        }
        button[type="submit"] {
            background: linear-gradient(to right, var(--deep-red), var(--dark-red));
            color: #FFFFFF; 
            border: none; 
            padding: 13px; 
            width: 100%;
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            margin-top: 20px;
            transition: opacity 0.2s;
        }
        button[type="submit"]:hover { 
            opacity: 0.9; 
        }
        .google-btn {
            background: #ffffff;
            color: #444;
            border: 2px solid #ddd;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: background 0.2s, border-color 0.2s;
        }
        .google-btn:hover { 
            background: #f8f9fa; 
            border-color: #ccc; 
        }
        .google-icon { 
            width: 18px; 
            height: 18px; 
        }
        .divider {
            text-align: center;
            margin: 15px 0;
            position: relative;
            font-size: 12px;
            color: #666;
        }
        .divider::before, .divider::after {
            content: "";
            position: absolute;
            top: 50%;
            width: 42%;
            height: 1px;
            background: #ddd;
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }
        .switch-link { 
            text-align: center; 
            margin-top: 18px; 
            font-size: 14px; 
            color: #333; 
        }
        .switch-link a { 
            color: var(--accent-blue); 
            font-weight: bold; 
            text-decoration: underline; 
        }
        .error-msg { 
            color: var(--deep-red); 
            font-size: 13px; 
            text-align: center; 
            margin-top: 12px; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Connexion DPE VOICE</h2>

        <form id="loginForm">
            <label for="loginEmail">Adresse Email :</label>
            <input type="email" id="loginEmail" required placeholder="exemple@domaine.com">

            <label for="loginPassword">Mot de passe :</label>
            <div class="password-container">
                <input type="password" id="loginPassword" required placeholder="••••••••">
                <span class="toggle-password" onclick="togglePasswordVisibility('loginPassword', this)">👁️</span>
            </div>

            <button type="submit" id="btnLogin">Se connecter</button>
            <div id="loginError" class="error-msg"></div>
        </form>

        <div class="divider">OU</div>

        <button type="button" id="googleLoginBtn" class="google-btn">
            <svg class="google-icon" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.15C3.18 21.31 7.27 24 12 24z"/>
                <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.39-1.5-.39-2.24s.14-1.52.39-2.24V6.61H1.19C.43 8.14 0 9.88 0 12s.43 3.86 1.19 5.39l4.08-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.27 0 3.18 2.69 1.19 6.61l4.08 3.15c.95-2.85 3.6-4.96 6.73-4.96z"/>
            </svg>
            Continuer avec Google
        </button>

        <div class="switch-link">
            <span>Pas encore de compte ?</span> <a href="inscription.html">S'inscrire</a>
        </div>
    </div>

    <!-- Script utilitaire pour afficher/masquer le mot de passe -->
    <script>
        function togglePasswordVisibility(fieldId, iconElement) {
            const field = document.getElementById(fieldId);
            if (!field) return;
            field.type = field.type === "password" ? "text" : "password";
            iconElement.textContent = field.type === "password" ? "👁️" : "🙈";
        }
    </script>

    <!-- Script Logique Firebase pour la Connexion -->
    <script type="module">
        import { auth, database } from "./love-bebe-service.js";
        import { signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { ref, get, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const loginForm = document.getElementById('loginForm');
        const loginError = document.getElementById('loginError');
        const googleLoginBtn = document.getElementById('googleLoginBtn');

        // Connexion classique par Email et Mot de passe
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.textContent = "";
            const btnLogin = document.getElementById('btnLogin');

            try {
                btnLogin.disabled = true;
                btnLogin.textContent = "Connexion en cours...";

                const email = document.getElementById('loginEmail').value.trim();
                const password = document.getElementById('loginPassword').value;

                await signInWithEmailAndPassword(auth, email, password);

                // Redirection vers l'application principale
                window.location.href = "index.html";
            } catch (err) {
                loginError.textContent = "Erreur de connexion : " + err.message;
            } finally {
                btnLogin.disabled = false;
                btnLogin.textContent = "Se connecter";
            }
        });

        // Connexion rapide avec Google
        googleLoginBtn.addEventListener('click', async () => {
            loginError.textContent = "";
            try {
                const provider = new GoogleAuthProvider();
                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                // Vérifier si l'utilisateur existe dans la base de données, sinon l'initialiser
                const userRef = ref(database, `users/${user.uid}`);
                const snapshot = await get(userRef);

                if (!snapshot.exists()) {
                    await set(userRef, {
                        fullName: user.displayName || "Utilisateur DPE",
                        email: user.email,
                        createdAt: new Date().toISOString()
                    });
                }

                // Redirection vers l'application principale
                window.location.href = "index.html";
            } catch (err) {
                loginError.textContent = "Erreur Google Auth : " + err.message;
            }
        });
    </script>
</body>
</html>
